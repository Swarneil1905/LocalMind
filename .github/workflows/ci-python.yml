name: CI – Python

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: ruff lint + import check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: services/ai
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff==0.15.16

      - name: ruff lint
        working-directory: services/ai
        run: ruff check .

      - name: Chat and retrieval regression tests
        working-directory: services/ai
        run: python -m unittest discover -s tests -v

      - name: Verify sidecar entry point imports cleanly
        working-directory: services/ai
        run: python -c "import app.main; import app.api.routes.health"

      - name: Release tooling tests
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign
          ruff check --config services/ai/pyproject.toml scripts/release
          python -m unittest discover -s scripts/release -p "test_*.py" -v

name: CI – Python

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    name: ruff lint + import check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: services/ai
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff==0.15.16 coverage==7.10.7

      - name: ruff lint
        working-directory: services/ai
        run: ruff check .

      - name: Backend unit, database and app integration tests
        id: python-tests
        working-directory: services/ai
        run: python -m coverage run --branch --source=app -m unittest discover -s tests -v

      # The app contract launches a clean subprocess. Its assertions run above,
      # but these reports measure only the parent test process, not child coverage.
      - name: Report in-process backend coverage
        if: always() && steps.python-tests.outcome != 'skipped'
        working-directory: services/ai
        run: |
          python -m coverage report
          python -m coverage xml -o ../../artifacts/test-results/python-coverage.xml
          python -m coverage json -o ../../artifacts/test-results/python-coverage.json

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: artifacts/test-results/python-coverage.*
          retention-days: 14

      - name: Conversation baseline and inventory checks
        run: |
          ruff check --config services/ai/pyproject.toml scripts/evaluation
          ruff check --config services/ai/pyproject.toml scripts/media
          python scripts/evaluation/check_suite.py
          python -m unittest discover -s scripts/evaluation -p "test_*.py" -v
          python scripts/evaluation/workspace_repair_gate.py

      - name: Verify sidecar entry point imports cleanly
        working-directory: services/ai
        run: python -c "import app.main; import app.api.routes.health"

      - name: Release tooling tests
        env:
          LOCALMIND_TEST_LINUXDEPLOY: "1"
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign gcc
          ruff check --config services/ai/pyproject.toml scripts/release
          python -m unittest discover -s scripts/release -p "test_*.py" -v

  database-platforms:
    name: SQLite persistence (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Exercise database migrations, rollback and profile isolation
        env:
          PYTHONPATH: services/ai
        run: python -m unittest discover -s services/ai/tests -p "test_database_persistence.py" -v

      - name: Install visual and document test dependencies
        run: python -m pip install Pillow==12.0.0 pypdf==5.1.0

      - name: Verify portable application contract
        env:
          PYTHONPATH: services/ai
        run: python -m unittest discover -s services/ai/tests -p "test_api_contracts.py" -v

      - name: Exercise visual revisions, attachment ownership and document workers
        env:
          PYTHONPATH: services/ai
        run: python -m unittest discover -s services/ai/tests -p "test_visual_documents.py" -v

  windows-repair-gate:
    name: Windows repair conflicts and recovery
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused test dependencies
        run: python -m pip install fastapi==0.115.5 httpx==0.28.1 keyring==25.7.0
      - name: Exercise real Windows file locks and process interruptions
        env:
          PYTHONPATH: services/ai
        run: |
          python -m unittest discover -s services/ai/tests -p "test_repair_apply.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/evaluation/workspace_repair_gate.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise Windows speech cancellation and audio cleanup
        env:
          PYTHONPATH: services/ai
        run: python -m unittest discover -s services/ai/tests -p "test_voice.py" -v
      - name: Upload repair gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-repair-gate
          path: artifacts/evaluation/workspace-repair-gate.json

      - name: Exercise native credentials and owned MCP transport
        env:
          PYTHONPATH: services/ai
          LOCALMIND_TEST_NATIVE_CREDENTIALS: "1"
        run: |
          python -m unittest discover -s services/ai/tests -p "test_connections.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s services/ai/tests -p "test_mcp.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s services/ai/tests -p "test_extensions.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

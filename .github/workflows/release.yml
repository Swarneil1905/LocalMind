name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified build as the latest release
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Check release version
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - id: version
        run: python scripts/release/check_version.py

  frontend:
    name: Frontend checks
    uses: ./.github/workflows/ci-frontend.yml
  python:
    name: Python checks
    uses: ./.github/workflows/ci-python.yml
  rust:
    name: Rust checks
    uses: ./.github/workflows/ci-rust.yml

  build:
    name: Build (${{ matrix.label }})
    needs: [version, frontend, python, rust]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-2022
            target: x86_64-pc-windows-msvc
            python-arch: x64
            bundles: nsis
            label: windows-x64
          - platform: macos-15-intel
            target: x86_64-apple-darwin
            python-arch: x64
            bundles: app,dmg
            label: macos-x64
          - platform: macos-15
            target: aarch64-apple-darwin
            python-arch: arm64
            bundles: app,dmg
            label: macos-arm64
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            python-arch: x64
            bundles: deb,appimage
            label: linux-x64
    runs-on: ${{ matrix.platform }}
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@v4

      - name: Free space on the disposable Linux runner
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h .

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf zstd

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: release-cargo-${{ matrix.label }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: release-cargo-${{ matrix.label }}-

      - uses: pnpm/action-setup@v4
        with:
          version: "11.0.9"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: ${{ matrix.python-arch }}

      - name: Test macOS disk image recovery
        if: runner.os == 'macOS'
        run: python -m unittest discover -s scripts/release -p "test_build_macos.py" -v

      - name: Install sidecar build dependencies
        # 6.17 fixes collection of setuptools' vendored backports namespace.
        run: python -m pip install -r services/ai/requirements.txt pyinstaller==6.17.0

      - name: Build the native sidecar
        run: python scripts/release/build_sidecar.py --target ${{ matrix.target }}

      - name: Test the packaged sidecar in a fresh profile
        run: python scripts/release/smoke_sidecar.py --target ${{ matrix.target }}

      - name: Bundle and test the complete Ollama runtime
        run: python scripts/release/bundle_ollama.py --target ${{ matrix.target }}
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Build Linux installers and signed updater bundles
        if: runner.os == 'Linux'
        # Resolve Ollama's common libraries only in the packaging subprocess.
        # Later payload tests must not inherit paths into the staging directory.
        run: python scripts/release/build_linux.py
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      - name: Build macOS installers and signed updater bundles
        if: runner.os == 'macOS'
        run: python scripts/release/build_macos.py --target ${{ matrix.target }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          APPLE_SIGNING_IDENTITY: "-"

      - name: Build Windows installers and signed updater bundles
        if: runner.os == 'Windows'
        run: pnpm --filter desktop tauri build --verbose --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      - name: Test installer payloads
        run: python scripts/release/smoke_bundle.py --target ${{ matrix.target }}

      - name: Collect release assets
        run: python scripts/release/artifacts.py collect --target ${{ matrix.target }} --version ${{ needs.version.outputs.version }} --out release-platform

      - name: Upload verified platform files
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.label }}
          path: release-platform/
          compression-level: 0
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Verify and publish release
    needs: [version, build]
    # minisign is available in Noble's universe repository, not Jammy's.
    # This job verifies existing artifacts; keep Linux builds on 22.04 above.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Free space on the disposable publisher
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h .
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install signature verification
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: platform-artifacts
      - name: Verify signatures and assemble the updater
        run: python scripts/release/artifacts.py assemble --input platform-artifacts --out release-assets --version ${{ needs.version.outputs.version }} --repository ${{ github.repository }}
      - name: Publish the complete release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish == true
        run: python scripts/release/publish.py --version ${{ needs.version.outputs.version }} --assets release-assets
        env:
          GH_TOKEN: ${{ github.token }}

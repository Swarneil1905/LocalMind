[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Pin the linting scope explicitly. Ruff has repeatedly widened its
# "default" rule set across releases (adding flake8-bandit, flake8-blind-except,
# flake8-datetimez, isort, pylint, etc). Without an explicit select here,
# CI silently starts failing on unrelated categories every time an unpinned
# `pip install ruff` picks up a newer release. This keeps CI checking what it
# always meant to check: real bugs (pyflakes) and basic style (pycodestyle).
select = ["E4", "E7", "E9", "F"]

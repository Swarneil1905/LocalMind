<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1280" viewBox="0 0 1440 1280" role="img" aria-labelledby="title desc">
<title id="title">LocalMind MVP architecture</title>
<desc id="desc">A local desktop workspace sends durable requests to a coordinator. Direct chat, document evidence and bounded tasks converge at a model gateway. Cloud calls require consent. Validated results return to the workspace. Versioned local storage and background indexing support the paths.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#55776d"/></marker></defs>
<rect width="1440" height="1280" fill="#f7faf8"/>
<style>text{font-family:Segoe UI,Arial,sans-serif;fill:#203d33}.title{font-size:30px;font-weight:650}.head{font-size:21px;font-weight:650}.body{font-size:17px}.small{font-size:15px;fill:#526d63}.label{font-size:14px;font-weight:600;letter-spacing:1px}</style>
<text x="60" y="51" class="title">LocalMind | The MVP architecture</text>
<text x="60" y="80" class="label">PROPOSED DESIGN  ·  DESKTOP FIRST  ·  OPTIONAL CLOUD  ·  NOT BENCHMARKED</text>
<rect x="60" y="110" width="1320" height="95" rx="12" fill="#edf4ef" stroke="#c8d8cf"/>
<text x="82" y="144" class="head">One workspace</text>
<text x="82" y="175" class="body">Chat and mini chat  /  pasted screenshots  /  source viewer  /  editable diagrams and drafts</text>
<path d="M720 205 V240" fill="none" stroke="#55776d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="60" y="240" width="1320" height="105" rx="12" fill="#ffffff" stroke="#c8d8cf"/>
<text x="82" y="274" class="head">Durable request coordinator</text>
<text x="82" y="305" class="body">Resolve profile + conversation + project → persist run → choose route → enforce permissions and budget</text>
<text x="82" y="331" class="body">React + Tauri host → authenticated local Python service; restart and cancel are explicit states</text>
<path d="M720 345 V365 H270 V395" fill="none" stroke="#55776d" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M720 365 V395" fill="none" stroke="#55776d" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M720 365 H1170 V395" fill="none" stroke="#55776d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="60" y="395" width="420" height="220" rx="12" fill="#ffffff" stroke="#c8d8cf"/>
<text x="82" y="429" class="head">01  Direct conversation</text>
<text x="82" y="460" class="body">Current request and recent history</text>
<text x="82" y="486" class="body">Relevant, editable memory only</text>
<text x="82" y="512" class="body">One model call for ordinary chat</text>
<text x="82" y="538" class="body">No retrieval required for a greeting</text>
<text x="82" y="564" class="body">Fast mode where the model supports it</text>
<rect x="510" y="395" width="420" height="220" rx="12" fill="#ffffff" stroke="#c8d8cf"/>
<text x="532" y="429" class="head">02  Document evidence</text>
<text x="532" y="460" class="body">Scoped FTS + vector candidates</text>
<text x="532" y="486" class="body">Fuse → optional rerank → coverage</text>
<text x="532" y="512" class="body">Versioned passages and locations</text>
<text x="532" y="538" class="body">Missing evidence is an explicit state</text>
<text x="532" y="564" class="body">Existing hybrid search is the baseline</text>
<rect x="960" y="395" width="420" height="220" rx="12" fill="#ffffff" stroke="#c8d8cf"/>
<text x="982" y="429" class="head">03  Bounded work</text>
<text x="982" y="460" class="body">LangGraph executor behind run API</text>
<text x="982" y="486" class="body">Search, read, compare and draft</text>
<text x="982" y="512" class="body">Tool / model / time / cost limits</text>
<text x="982" y="538" class="body">Approve exact write arguments</text>
<text x="982" y="564" class="body">Persist intent, then success receipt</text>
<path d="M270 615 V643 H720 V675" fill="none" stroke="#55776d" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M720 615 V675" fill="none" stroke="#55776d" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1170 615 V643 H720" fill="none" stroke="#55776d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="60" y="675" width="870" height="110" rx="12" fill="#edf4ef" stroke="#c8d8cf"/>
<text x="82" y="709" class="head">Context and model gateway</text>
<text x="82" y="740" class="body">Select by user choice, modality, capability, privacy and available memory</text>
<text x="82" y="766" class="body">One foreground GPU slot; pause background work; stream typed events</text>
<rect x="980" y="675" width="400" height="110" rx="12" fill="#f4f1e9" stroke="#c8d8cf"/>
<text x="1002" y="709" class="head">Optional remote providers</text>
<text x="1002" y="740" class="body">User API key + scoped consent</text>
<text x="1002" y="766" class="body">Approved payload + spend reservation</text>
<path d="M930 730 H980" fill="none" stroke="#55776d" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<rect x="60" y="820" width="420" height="115" rx="12" fill="#ffffff" stroke="#c8d8cf"/>
<text x="82" y="854" class="head">Local generation</text>
<text x="82" y="885" class="body">Ollama: chat or vision model</text>
<text x="82" y="911" class="body">Qwen3 8B / VL 4B are test baselines</text>
<rect x="510" y="820" width="420" height="115" rx="12" fill="#ffffff" stroke="#c8d8cf"/>
<text x="532" y="854" class="head">Retrieval models</text>
<text x="532" y="885" class="body">Nomic vs Qwen embedding 0.6B</text>
<text x="532" y="911" class="body">Qwen reranker 0.6B: optional test</text>
<rect x="980" y="820" width="400" height="115" rx="12" fill="#ffffff" stroke="#c8d8cf"/>
<text x="1002" y="854" class="head">Owned background workers</text>
<text x="1002" y="885" class="body">Parse / OCR / index / speech</text>
<text x="1002" y="911" class="body">Hash → stage → activate version</text>
<path d="M270 785 V820" fill="none" stroke="#55776d" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M720 785 V820" fill="none" stroke="#55776d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="999" y="811" class="small">Separate local worker lifecycle</text>
<rect x="60" y="975" width="1320" height="95" rx="12" fill="#edf4ef" stroke="#c8d8cf"/>
<text x="82" y="1009" class="head">Validate, persist and present</text>
<text x="82" y="1040" class="body">Citation IDs + claim support + source coverage  /  safe artifact schemas  /  final answer and event replay</text>
<path d="M270 935 V975" fill="none" stroke="#55776d" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1380 730 H1405 V1022 H1380" fill="none" stroke="#55776d" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<path d="M60 1022 H28 V158 H60" fill="none" stroke="#55776d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="82" y="1110" class="label">DATA FOUNDATION · LOCAL AUTHORITY, REBUILDABLE SEARCH INDEXES</text>
<rect x="60" y="1130" width="420" height="95" rx="12" fill="#ffffff" stroke="#c8d8cf"/>
<text x="82" y="1164" class="head">SQLite + FTS5</text>
<text x="82" y="1195" class="body">State, scope, runs, versions, exact terms</text>
<rect x="510" y="1130" width="420" height="95" rx="12" fill="#ffffff" stroke="#c8d8cf"/>
<text x="532" y="1164" class="head">LanceDB + managed files</text>
<text x="532" y="1195" class="body">Vectors per model; source snapshots</text>
<rect x="960" y="1130" width="420" height="95" rx="12" fill="#ffffff" stroke="#c8d8cf"/>
<text x="982" y="1164" class="head">Native credential store</text>
<text x="982" y="1195" class="body">Secrets stay outside model context</text>
<text x="60" y="1258" class="small">Future shared service: PostgreSQL + pgvector + object storage. Database choice does not determine model intelligence.</text>
</svg>